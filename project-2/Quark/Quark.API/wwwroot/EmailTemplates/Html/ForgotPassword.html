<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Şifre Sıfırlama</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .email-header {
            background-color: #daeef0;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .email-header img {
            max-height: 60px;
            margin-bottom: 10px;
        }
        .email-body {
            padding: 30px;
            color: #333333;
        }
        .email-body p {
            line-height: 1.6;
        }
        .reset-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #daeef0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .email-footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888888;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        <!-- Logo alanı -->
        <img src="https://cmhmedia.b-cdn.net/cumhuriyet-logo.svg" alt="Şirket Logosu">
    </div>
    <div class="email-body">
        <p>Merhaba {{fullname}},</p>
        <p>Şifrenizi sıfırlamak için bir istek aldık. Eğer bu isteği siz yapmadıysanız, bu e-postayı dikkate almayabilirsiniz.</p>
        <p>Yeni Şifre:</p>
        <a class="reset-button">{{password}}</a>
        <div class="email-footer">
            <p>&copy; 2025 @Cumhuriyet Tüm hakları saklıdır.</p>
        </div>
    </div>
</div>
</body>
</html>
