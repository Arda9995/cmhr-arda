name: Remote Consolidation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REMOTE_MIGRATION_TOKEN }}

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Stage Source Repository 1 (Google AI RSS)
        env:
          SRC_TOKEN: ${{ secrets.REMOTE_MIGRATION_TOKEN }}
        run: |
          echo "Cloning source repo 1..."
          git clone --depth 1 "https://x-access-token:${SRC_TOKEN}@github.com/mkty/26_chmryt_Googl_ai_rss.git" tmp_repo1
          mkdir -p project-1
          rm -rf tmp_repo1/.git tmp_repo1/.github
          find tmp_repo1 -type f -name ".env*" -exec rm -f {} +
          cp -a tmp_repo1/. project-1/
          rm -rf tmp_repo1

      - name: Fetch and Stage Source Repository 2 (CMHRYT)
        env:
          SRC_TOKEN: ${{ secrets.REMOTE_MIGRATION_TOKEN }}
        run: |
          echo "Cloning source repo 2..."
          git clone --depth 1 "https://x-access-token:${SRC_TOKEN}@github.com/mkty/26_cmhryt.git" tmp_repo2
          mkdir -p project-2
          rm -rf tmp_repo2/.git tmp_repo2/.github
          find tmp_repo2 -type f -name ".env*" -exec rm -f {} +
          cp -a tmp_repo2/. project-2/
          rm -rf tmp_repo2

      - name: Generate Root README
        run: |
          cat << 'EOF' > README.md
          # cmhr-arda

          Consolidated repository containing two distinct projects:

          ## Projects

          ### 1. `project-1/`
          - **Source Repository**: [mkty/26_chmryt_Googl_ai_rss](https://github.com/mkty/26_chmryt_Googl_ai_rss)
          - **Description**: Google AI RSS feed integration, scheduled background workers, and archiving utilities.

          ### 2. `project-2/`
          - **Source Repository**: [mkty/26_cmhryt](https://github.com/mkty/26_cmhryt)
          - **Description**: Core CMHRYT services and application platform.

          ---
          *Migrated remotely into separate directories without retaining local clones or exposing source credentials.*
          EOF

      - name: Remove Temporary Migration Workflow
        run: |
          rm -rf .github

      - name: Commit and Push Consolidated Projects
        run: |
          git add -A
          git status
          git commit -m "feat: consolidate project-1 and project-2 into unified repository"
          git push origin main
